{% comment %}
  Giscus 留言區（覆寫 minima 內建的 Disqus）。
  啟用前先做三件事：
  1. 倉庫 Settings > General 最下面勾選 Discussions
  2. 到 github.com/apps/giscus 按 Install，只選這個倉庫
  3. 到 giscus.app 選好 repo 跟分類，把四個值貼回來換掉下面的 YOUR_ 開頭
  換好之前留言區不會出現，不會影響其他頁面。
{% endcomment %}
<script src="https://giscus.app/client.js"
  data-repo="motorgp2004-prog/motorgp2004-prog.github.io"
  data-repo-id="YOUR_REPO_ID"
  data-category="Announcements"
  data-category-id="YOUR_CATEGORY_ID"
  data-mapping="pathname"
  data-strict="0"
  data-reactions-enabled="1"
  data-emit-metadata="0"
  data-input-position="bottom"
  data-theme="preferred_color_scheme"
  data-lang="zh-TW"
  crossorigin="anonymous"
  async>
</script>
